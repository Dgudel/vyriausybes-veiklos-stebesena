# Sugeneruoja švieslentę ir paskelbia ją GitHub Pages.
# Paleidžiama: kiekvieną kartą įkėlus pakeitimus į main šaką, kas mėnesį 25 d. ir rankiniu būdu (Actions → Run workflow).
name: Švieslentės atnaujinimas

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 25 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generuoti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sugeneruoti svetainę
        env:
          ATNAUJINTI: "1"    # atsisiųsti naujausius duomenis iš data.gov.lt, kur nurodyti modeliai
        run: python generuoti.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  paskelbti:
    needs: generuoti
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
